<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Perpustakaan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="text-center mb-4">📚 Sistem Perpustakaan</h1>

    <!-- Form Tambah Buku -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-primary text-white">Tambah Buku Baru</div>
      <div class="card-body">
        <form id="bookForm" class="row g-3">
          <div class="col-md-5">
            <input type="text" id="title" class="form-control" placeholder="Judul Buku" required>
          </div>
          <div class="col-md-4">
            <input type="text" id="author" class="form-control" placeholder="Penulis" required>
          </div>
          <div class="col-md-2">
            <input type="number" id="year" class="form-control" placeholder="Tahun" required>
          </div>
          <div class="col-md-1">
            <button type="submit" class="btn btn-success w-100">Tambah</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Daftar Buku -->
    <div class="card shadow-sm">
      <div class="card-header bg-secondary text-white">Daftar Buku</div>
      <div class="card-body">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>Judul</th>
              <th>Penulis</th>
              <th>Tahun</th>
              <th class="text-end">Aksi</th>
            </tr>
          </thead>
          <tbody id="bookList">
            <tr><td colspan="4" class="text-center">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const bookList = document.getElementById('bookList');
    const bookForm = document.getElementById('bookForm');

    // Fetch Daftar Buku
    async function loadBooks() {
      try {
        const res = await fetch('/api/books');
        const books = await res.json();
        
        if (books.length === 0) {
          bookList.innerHTML = '<tr><td colspan="4" class="text-center">Belum ada buku.</td></tr>';
          return;
        }

        bookList.innerHTML = books.map(book => `
          <tr>
            <td><strong>${book.title}</strong></td>
            <td>${book.author}</td>
            <td>${book.year}</td>
            <td class="text-end">
              <button onclick="deleteBook('${book.id}')" class="btn btn-danger btn-sm">Hapus</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        bookList.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Gagal memuat data buku.</td></tr>';
      }
    }

    // Tambah Buku Baru
    bookForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const year = document.getElementById('year').value;

      await fetch('/api/books', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, author, year })
      });

      bookForm.reset();
      loadBooks();
    });

    // Hapus Buku
    async function deleteBook(id) {
      if (confirm('Yakin ingin menghapus buku ini?')) {
        await fetch(`/api/books/${id}`, { method: 'DELETE' });
        loadBooks();
      }
    }

    // Load data awal
    loadBooks();
  </script>
</body>
</html>
